<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="lib/icons.js"></script>
    <script src="theme-init.js"></script>
    <title>Sida till PDF</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <a class="skip-link" href="#site-card" data-i18n="a11y.skipContent">Hoppa till huvudinnehåll</a>
    <header class="popup-header">
      <img class="app-icon" src="../icons/icon48.png" width="34" height="34" alt="" />
      <div class="titles">
        <h1 data-i18n="appName">Sida till PDF</h1>
        <p class="muted" data-i18n="popup.subtitle">Valda webbplatser, ett klick</p>
      </div>
      <button
        id="open-options"
        class="icon-btn"
        type="button"
        data-i18n-title="popup.settings"
        data-i18n-aria-label="popup.settings"
        title="Inställningar"
      >
        <span class="icon-slot" data-icon="settings" data-icon-size="18" aria-hidden="true"></span>
      </button>
    </header>

    <main id="main-content">
    <section id="site-card" class="site-card" tabindex="-1" aria-live="polite">
      <div class="site-row">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
        <div class="site-text">
          <strong id="site-name" class="site-name">…</strong>
          <span id="status-pill" class="pill">…</span>
        </div>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
    <div id="banner-actions" class="banner-actions" hidden>
      <button id="open-pdf" class="link link-with-icon" type="button">
        <span class="icon-slot" data-icon="external" data-icon-size="13" aria-hidden="true"></span>
        <span data-i18n="popup.openPdf">Öppna PDF</span>
      </button>
      <button id="show-folder" class="link link-with-icon" type="button">
        <span class="icon-slot" data-icon="folder" data-icon-size="13" aria-hidden="true"></span>
        <span data-i18n="popup.showInFolder">Visa i mapp</span>
      </button>
    </div>

    <button id="primary" class="btn btn-primary btn-block" type="button">
      <span id="primary-label" data-i18n="popup.save">Spara som PDF</span>
    </button>

    <button id="preview-content" class="btn btn-ghost btn-block" type="button" data-i18n="popup.previewContent" hidden>Förhandsgranska innehåll</button>
    <button id="secondary" class="btn btn-ghost btn-block" type="button" hidden></button>

    <div class="field field-column page-range-field">
      <label class="field-label" for="page-ranges" data-i18n="popup.pageRanges">Sidintervall</label>
      <input id="page-ranges" class="input" type="text" inputmode="numeric" maxlength="200" data-i18n-placeholder="popup.pageRangesPlaceholder" placeholder="Alla sidor eller t.ex. 1-3, 5" />
      <span class="field-note" data-i18n="popup.pageRangesHint">Lämna tomt för alla sidor.</span>
    </div>

    <div class="option-row">
      <div class="option-text">
        <span class="option-label" data-i18n="popup.saveAs">Fråga var filen ska sparas</span>
        <span id="save-as-note" class="option-note" data-i18n="popup.saveAsHint">Du väljer mapp i webbläsarens dialog.</span>
      </div>
      <label class="switch">
        <input id="save-as" type="checkbox" />
        <span class="track"></span>
        <span class="sr-only" data-i18n="popup.saveAs"></span>
      </label>
    </div>

    <div class="filename-row">
      <span class="muted" data-i18n="popup.filename">Filnamn</span>
      <span id="filename-preview" class="filename-value">…</span>
    </div>

    <div class="last-saved">
      <span class="muted" data-i18n="popup.lastSaved">Senast sparad</span>
      <span id="last-saved" class="last-file">–</span>
    </div>

    <section class="update-card" aria-labelledby="update-title">
      <div class="update-heading">
        <strong id="update-title" data-i18n="update.title">GitHub-uppdatering</strong>
        <span id="installed-version" class="muted"></span>
      </div>
      <p id="update-status" class="update-status" role="status" aria-live="polite" data-i18n="update.idle">
        Kontrollera om en ny version finns.
      </p>
      <button id="check-updates" class="btn btn-ghost btn-block" type="button" data-i18n="update.check">
        Sök efter uppdateringar
      </button>
      <a id="release-link" class="link release-link" href="#" target="_blank" rel="noopener noreferrer" hidden data-i18n="update.openRelease">
        Öppna GitHub-releasen
      </a>
      <ul id="changed-files" class="changed-files" hidden></ul>
    </section>
    </main>

    <footer class="popup-footer">
      <span id="shortcut" class="muted"></span>
      <button id="settings-link" class="link" type="button" data-i18n="popup.settings">Inställningar</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
